name = "libitb3_gleam"
version = "0.5.1"
target = "erlang"
gleam = ">= 1.11.0"
description = "ITB Symmetric Cipher Construction with Ambiguity-Based Security - Gleam"
licences = ["Apache-2.0"]
repository = { type = "github", user = "everanium", repo = "itb", path = "bindings/gleam" }
links = [{ title = "Repository", href = "https://github.com/everanium/itb" }]

# The Erlang binding (bindings/erlang) is the backend: a standard OTP
# application built by rebar3, carrying the only native code in the
# BEAM stack (the NIF shim over libitb3.so). rebar3 applications are
# not Gleam packages, so the backend cannot appear under
# [dependencies]; instead the FFI adapter (src/itb3_gleam_ffi.erl)
# adds the backend's ebin directory to the code path at first use —
# ../erlang/_build/default/lib/libitb3/ebin relative to this project, or
# the ITB_ERLANG_EBIN environment variable when set. ./build.sh
# builds the backend before compiling this project.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
